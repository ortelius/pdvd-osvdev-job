---
replicaCount: 1
image:
  repository: quay.io/ortelius/osvdev-job
  tag: main-v10.0.92-g2eebd3
  sha: sha256:6720749f6628a424466140733ee11ce73d600a1b457d76d4d6ec7971b05c00ce
  pullPolicy: Always

schedule: "*/15 * * * *"
concurrencyPolicy: Forbid
restartPolicy: OnFailure
startingDeadlineSeconds: 120
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 1
backoffLimit: 2

# Cap a run below the 15 min schedule interval so a stall fails fast and the
# next tick still runs. 780s leaves ~2 min of slack for pod startup and the
# lifecycle-tracking pass that follows ecosystem processing.
activeDeadlineSeconds: 780

# Reap completed pods; three Completed pods were accumulating per hour.
ttlSecondsAfterFinished: 300

mitreMappingUrl: ""

# HTTP tunables passed to the Go binary as env vars. Defaults match the
# in-code defaults; override without rebuilding the image.
#   requestTimeout x maxAttempts bounds worst case per ecosystem at 720s,
#   which stays under activeDeadlineSeconds.
http:
  dialTimeout: "10s"
  tlsTimeout: "10s"
  responseHeaderTimeout: "60s"
  requestTimeout: "240s"
  maxAttempts: 3
  maxBodyMB: 512

extraEnv: []

# Sized to co-schedule both CronJobs on one e2-standard-2 batch node
# (~1930m allocatable, ~500m consumed by DaemonSets).
resources:
  requests:
    cpu: 300m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

# Pin to the preemptible batch pool. The toleration is required: batch-pool
# carries workload=batch:NoSchedule so nothing else can land there, and
# without it these pods fall back onto system-pool alongside ArangoDB.
nodeSelector:
  kubernetes.io/os: linux
  workload: batch

tolerations:
  - key: workload
    operator: Equal
    value: batch
    effect: NoSchedule

affinity: {}